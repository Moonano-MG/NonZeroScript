name: 构建 Build

# 每次运行都产出下载物（run 页面底部 Artifacts），GitHub 会自动把每个
# artifact 打包成 zip 供下载：
#   NonZeroScript          原生控制台（Tauri 2：NonZeroScript.exe + controller.exe + LICENSE）
#   extension              Chrome / Edge 插件文件夹（直接"加载已解压"）
#   editor-godot-4.7.2     Godot 插件 addons/nonzeroscript（标准 GDScript）
# 仓库里不再放 zip；手动运行：Actions -> 构建 Build -> Run workflow

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Versions and adapter catalogues
        run: python .github/build.py --check

      - name: Python sources compile
        run: python -m compileall -q controller .github

      - name: JavaScript syntax
        run: |
          fail=0
          for f in extension/*.js extension/core/*.js extension/providers/*.js console/ui/app.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: GDScript parses
        run: |
          python -m pip install --quiet gdtoolkit
          gdparse editor/godot-4.7.2/plugin.gd \
                  editor/godot-4.7.2/core/bridge.gd \
                  editor/godot-4.7.2/core/commands.gd \
                  editor/godot-4.7.2/ui/dock.gd

  build:
    name: Build (Windows 64-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Rust toolchain
        shell: pwsh
        run: rustc --version

      - name: Stage extension/ and addons/
        run: python .github/build.py --out out

      - name: Build controller.exe (PyInstaller, one file)
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller
          pyinstaller --noconfirm --clean --onefile --noconsole --name controller --paths controller --hidden-import hub --hidden-import server --hidden-import settings --hidden-import memory --hidden-import metrics --hidden-import version --add-data "console/ui;ui" --distpath out/app --workpath "$env:RUNNER_TEMP/pyi" controller/main.py

      - name: Build NonZeroScript.exe (Tauri 2 console)
        shell: pwsh
        run: |
          cd console
          npm install --no-audit --no-fund
          npx tauri build
          Copy-Item "src-tauri\target\release\nonzeroscript-console.exe" "..\out\app\NonZeroScript.exe"

      - name: Smoke the relay (controller.exe standalone)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\app\controller.exe" -ArgumentList "--no-open" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:8790/api/status" -TimeoutSec 3
                if ($r) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              $diag = (Get-ChildItem "out\app" | Select-Object -ExpandProperty Name) -join ","
              "::error::relay smoke: controller.exe did not answer /api/status; out/app=[$diag]; alive=$(-not $p.HasExited)"
              exit 1
            }
            "smoke OK: controller.exe answered /api/status"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Name controller -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke the native console (NonZeroScript.exe)
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "out\app\NonZeroScript.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..25) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:8790/api/status" -TimeoutSec 3
                if ($r) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              Start-Sleep -Seconds 1
              $appAlive = -not $app.HasExited
              $appCode = if ($appAlive) { "alive" } else { "exit=" + $app.ExitCode }
              $relayProc = [bool](Get-Process controller -ErrorAction SilentlyContinue)
              $listening = [bool](Get-NetTCPConnection -LocalPort 8790 -State Listen -ErrorAction SilentlyContinue)
              $files = (Get-ChildItem "out\app" | Select-Object -ExpandProperty Name) -join ","
              $data = (Get-ChildItem "out\app\data" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ","
              "::error::console smoke: no /api/status answer; app=$appCode relayProc=$relayProc listening8790=$listening out/app=[$files] data=[$data]"
              exit 1
            }
            "smoke OK: NonZeroScript.exe brought up the relay and /api/status answered"
          } finally {
            Stop-Process -Name NonZeroScript -Force -ErrorAction SilentlyContinue
            Stop-Process -Name controller -Force -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "out\app\data" -ErrorAction SilentlyContinue
          }

      - name: Write run summary
        if: always()
        shell: pwsh
        run: |
          @(
            "## 下载物 / outputs",
            "",
            "本页底部 **Artifacts**（点名字单独下载，GitHub 已自动打包为 zip）：",
            "",
            "- ``NonZeroScript`` — 原生控制台（内含 ``NonZeroScript.exe`` + ``controller.exe`` + LICENSE）",
            "- ``extension`` — Chrome / Edge 插件文件夹（内含 ``extension/``）",
            "- ``editor-godot-4.7.2`` — Godot 插件（内含 ``addons/nonzeroscript/``）"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload NonZeroScript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NonZeroScript
          path: out/app
          compression-level: 0
          if-no-files-found: error

      - name: Upload extension
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: out/browser
          compression-level: 0
          if-no-files-found: error

      - name: Upload editor-godot-4.7.2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-godot-4.7.2
          path: out/editor
          compression-level: 0
          if-no-files-found: error
