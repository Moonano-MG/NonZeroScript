name: 构建 Build

# 每次运行都会输出下载包：校验 -> 打三个包 -> 上传为 artifact（run 页面底部直接下载）。
# dist/ 里的包随代码一起提交；仓库不发 Release，也不打 tag。
#
# 手动运行：Actions -> 构建 Build -> Run workflow

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check + build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check versions and adapter catalogues
        run: python .github/build.py --check

      - name: Python sources compile
        run: python -m compileall -q controller .github

      - name: JavaScript syntax
        run: |
          fail=0
          for f in extension/*.js extension/core/*.js extension/providers/*.js controller/ui/app.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: GDScript parses
        run: |
          python -m pip install --quiet gdtoolkit
          gdparse editor/godot-4.7.2/plugin.gd \
                  editor/godot-4.7.2/core/bridge.gd \
                  editor/godot-4.7.2/core/commands.gd

      - name: Build controller.zip / extension.zip / editor-godot-4.7.2.zip
        run: python .github/build.py

      - name: Show what was built
        run: |
          ls -lh dist
          cat dist/SHA256SUMS.txt
          {
            echo "## 下载包 / packages"
            echo ""
            echo "本页底部 **Artifacts** 里就是下面这几个文件，点名字即可单独下载："
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload controller.zip
        uses: actions/upload-artifact@v7
        with:
          name: controller.zip
          path: dist/controller.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload extension.zip
        uses: actions/upload-artifact@v7
        with:
          name: extension.zip
          path: dist/extension.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload editor-godot-4.7.2.zip
        uses: actions/upload-artifact@v7
        with:
          name: editor-godot-4.7.2.zip
          path: dist/editor-godot-4.7.2.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
